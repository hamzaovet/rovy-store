name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          rm -f public/downloads/*.apk
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK & Prepare Asset
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/rovy-store.apk
          mkdir -p public/downloads
          cp dist-apk/rovy-store.apk public/downloads/rovy-store.apk
          ls -lh dist-apk/rovy-store.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rovy-store-apk
          path: dist-apk/rovy-store.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "روفي ستور — تطبيق الأندرويد الرسمي v1.0.0"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 💎 تطبيق روفي ستور (Rovy Store) الرسمي للأندرويد v1.0.0
            
            أهلاً بكم في تطبيق **روفي ستور (Rovy Store) — بوتيك العطور الفاخرة** الرسمي للأندرويد!
            
            ### 🔥 مميزات التطبيق:
            - تصفح كتالوج أفخم العطور العالمية والأصلية وتشكيلة الشتاء الفاخرة.
            - تفاصيل الهرم العطري والمكونات والبراند ودرجة الأصالة (أصلي / تيستر / ماستر كوبي).
            - طلب فوري وسريع بلمسة واحدة والدفع عند الاستلام مع ميزة التجربة قبل الدفع.
            - إشعارات فورية عند وصول أندر الإصدارات والخصومات الحصرية.
            
            ### 📥 طريقة التثبيت:
            1. اضغط على رابط التحميل بالأسفل `rovy-store.apk`.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. التطبيق مستقل ومخصص لمتجر روفي ستور (`com.rovystore.app`).
          files: dist-apk/rovy-store.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push APK to Repo
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/rovy-store.apk
          git commit -m "chore(release): host genuine compiled Rovy Store APK [skip ci]" || echo "No changes"
          git push origin main || true
